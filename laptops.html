<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptops | Student Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="flex min-h-screen flex-col">
  <header id="site-header" class="sticky top-0 z-20 border-b border-border bg-surface"></header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <h1 class="text-3xl font-extrabold">Laptop catalogue</h1>
    <p class="mt-1 text-muted">Search while you type, then narrow the list with the filters.</p>

    <section class="mt-6 rounded-xl border border-border bg-surface p-4" aria-label="Search and filters">
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <label class="block text-sm font-semibold">Search by name or brand
          <input id="search" type="search" class="field" placeholder="Try: Lenovo">
        </label>
        <label class="block text-sm font-semibold">Category
          <select id="category" class="field">
            <option value="all">All categories</option>
            <option value="ultrabook">Ultrabook</option>
            <option value="gaming">Gaming</option>
            <option value="2-in-1">2-in-1</option>
            <option value="creator">Creator</option>
            <option value="budget">Budget</option>
          </select>
        </label>
        <label class="block text-sm font-semibold">Maximum price: <span id="price-label" class="text-accent"></span>
          <input id="max-price" type="range" min="10000" max="110000" step="1000" value="110000" class="mt-3 block w-full accent-accent">
        </label>
        <label class="block text-sm font-semibold">Minimum RAM
          <select id="min-ram" class="field">
            <option value="0">Any</option>
            <option value="8">8 GB or more</option>
            <option value="16">16 GB or more</option>
            <option value="32">32 GB</option>
          </select>
        </label>
        <label class="block text-sm font-semibold">Minimum battery life
          <select id="min-battery" class="field">
            <option value="0">Any</option>
            <option value="8">8 hours or more</option>
            <option value="12">12 hours or more</option>
            <option value="15">15 hours or more</option>
          </select>
        </label>
        <label class="block text-sm font-semibold">Sort by
          <select id="sort" class="field">
            <option value="default">Default order</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="battery-asc">Battery life: low to high</option>
            <option value="battery-desc">Battery life: high to low</option>
            <option value="weight-asc">Weight: light to heavy</option>
            <option value="weight-desc">Weight: heavy to light</option>
          </select>
        </label>
      </div>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <p id="result-count" class="font-semibold" role="status"></p>
        <button id="reset" type="button" class="btn-outline">Reset filters</button>
      </div>
    </section>

    <div id="laptop-grid" class="mt-6 grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
    <p id="no-results" role="status" class="mt-6 hidden rounded-xl border border-dashed border-border bg-surface p-8 text-center text-lg">No laptop matches your search. Try changing or resetting the filters.</p>
  </main>

  <footer id="site-footer" class="border-t border-border bg-surface"></footer>

  <script type="module" src="src/js/laptops.js"></script>
</body>
</html>
